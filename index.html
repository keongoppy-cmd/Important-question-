<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Date Proposal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }body {
  height: 100vh;
  background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
  url('YOUR_IMAGE_LINK_HERE') center/cover no-repeat;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: white;
}

.container {
  background: rgba(0,0,0,0.55);
  padding: 40px;
  border-radius: 20px;
  width: 90%;
  max-width: 600px;
  backdrop-filter: blur(6px);
}

h1 {
  font-size: 3rem;
  margin-bottom: 20px;
}

p {
  font-size: 1.3rem;
  margin-bottom: 30px;
  line-height: 1.6;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

button {
  padding: 15px 30px;
  border: none;
  border-radius: 50px;
  font-size: 1rem;
  cursor: pointer;
  transition: 0.3s ease;
}

.yes {
  background: #ff4d6d;
  color: white;
}

.yes:hover {
  transform: scale(1.1);
  background: #ff1e4d;
}

.no {
  background: white;
  color: black;
  position: relative;
}

.message {
  margin-top: 25px;
  font-size: 1.5rem;
  display: none;
  color: #ffd166;
}

  </style>
</head>
<body>
  <div class="container">
    <h1>Hey Beautiful ❤️</h1>
    <p>
      Every moment with you feels special, and I was wondering...
      would you go on a date with me?
    </p><div class="buttons">
  <button class="yes" onclick="showMessage()">Yes 💖</button>
  <button class="no" id="noBtn">No 😢</button>
</div>

<div class="message" id="message">
  Yayyy! I can't wait for our date 🥰
</div>

  </div>  <script>
    function showMessage() {
      document.getElementById('message').style.display = 'block';
    }

    const noBtn = document.getElementById('noBtn');

    noBtn.addEventListener('mouseover', () => {
      const x = Math.floor(Math.random() * 300) - 150;
      const y = Math.floor(Math.random() * 300) - 150;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });
  </script></body>
</html>
