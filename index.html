<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Date Proposal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
      url('YOUR_IMAGE_LINK_HERE') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      overflow: hidden;
    }

    .container {
      background: rgba(0,0,0,0.55);
      padding: 40px;
      border-radius: 20px;
      width: 90%;
      max-width: 700px;
      backdrop-filter: blur(6px);
      position: relative;
      z-index: 10;
    }

    /* Tom and Jerry Animation */
    .meme-container {
      height: 150px;
      margin-bottom: 30px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .tom {
      font-size: 4rem;
      position: absolute;
      left: 10%;
      animation: tomWalk 4s infinite ease-in-out;
    }

    .jerry {
      font-size: 2.5rem;
      position: absolute;
      right: 10%;
      animation: jerryWalk 4s infinite ease-in-out;
    }

    .heart {
      font-size: 2rem;
      position: absolute;
      animation: floatHeart 3s infinite ease-in;
      opacity: 0;
    }

    @keyframes tomWalk {
      0% { left: 10%; transform: scaleX(1); }
      25% { left: 30%; }
      50% { left: 45%; }
      75% { left: 30%; }
      100% { left: 10%; }
    }

    @keyframes jerryWalk {
      0% { right: 10%; transform: scaleX(-1); }
      25% { right: 30%; }
      50% { right: 45%; }
      75% { right: 30%; }
      100% { right: 10%; }
    }

    @keyframes floatHeart {
      0% {
        bottom: 50px;
        opacity: 1;
        left: 50%;
        transform: translateX(-50%) scale(1);
      }
      50% {
        opacity: 1;
      }
      100% {
        bottom: 200px;
        opacity: 0;
        left: 50%;
        transform: translateX(-50%) scale(0.5);
      }
    }

    .hearts-burst {
      position: absolute;
      bottom: 50px;
      left: 50%;
      pointer-events: none;
    }

    /* Floating Hearts Background */
    .floating-hearts {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 5;
    }

    .falling-heart {
      position: absolute;
      font-size: 3rem;
      animation: fall 8s linear infinite;
      opacity: 0.8;
    }

    @keyframes fall {
      0% {
        top: -50px;
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        top: 100vh;
        opacity: 0;
      }
    }

    /* Love Modal/Popup */
    .love-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.5s ease-in;
    }

    .love-modal.active {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .love-content {
      background: linear-gradient(135deg, #ff4d6d 0%, #ff1e4d 100%);
      border-radius: 30px;
      padding: 50px;
      text-align: center;
      max-width: 500px;
      animation: popIn 0.6s ease-in-out;
      box-shadow: 0 20px 60px rgba(255, 77, 109, 0.6);
    }

    @keyframes popIn {
      0% {
        transform: scale(0) rotate(-45deg);
        opacity: 0;
      }
      50% {
        transform: scale(1.1) rotate(5deg);
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    .love-gif {
      width: 100%;
      max-width: 300px;
      border-radius: 20px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      animation: bounce 1s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-20px);
      }
    }

    .love-content h2 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: white;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .love-content p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: white;
      line-height: 1.8;
    }

    .close-btn {
      background: white;
      color: #ff4d6d;
      border: none;
      padding: 15px 40px;
      border-radius: 50px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s ease;
    }

    .close-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.3rem;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    button {
      padding: 15px 30px;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s ease;
      font-weight: bold;
    }

    .yes {
      background: #ff4d6d;
      color: white;
    }

    .yes:hover {
      transform: scale(1.1);
      background: #ff1e4d;
    }

    .no {
      background: white;
      color: black;
      position: relative;
    }

    .message {
      margin-top: 25px;
      font-size: 1.5rem;
      display: none;
      color: #ffd166;
      animation: celebrate 0.5s ease-in-out;
    }

    @keyframes celebrate {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

  </style>
</head>
<body>
  <!-- Floating Hearts Background -->
  <div class="floating-hearts" id="floatingHeartsContainer"></div>

  <div class="container">
    <!-- Tom and Jerry Animation -->
    <div class="meme-container">
      <div class="tom">🐱</div>
      <div class="jerry">🐭</div>
      <div class="hearts-burst" id="heartsBurst"></div>
    </div>

    <h1>Hey Beautiful ❤️</h1>

    <p>
      Every moment with you feels special, and I was wondering...
      would you go on a date with me?
    </p>

    <div class="buttons">
      <button class="yes" onclick="showLoveAnimation()">Yes 💖</button>
      <button class="no" id="noBtn">No 😢</button>
    </div>

    <div class="message" id="message">
      Yayyy! I can't wait for our date 🥰
    </div>

  </div>

  <!-- Love Modal with GIF -->
  <div class="love-modal" id="loveModal">
    <div class="love-content">
      <!-- Love GIF -->
      <img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif" alt="Love animation" class="love-gif">
      
      <h2>I Love You! 💕</h2>
      <p>You've made me the happiest person in the world!</p>
      
      <button class="close-btn" onclick="closeLoveModal()">Close 💕</button>
    </div>
  </div>

  <script>
    // Create falling hearts background
    function createFallingHearts() {
      const container = document.getElementById('floatingHeartsContainer');
      
      for (let i = 0; i < 15; i++) {
        const heart = document.createElement('div');
        heart.className = 'falling-heart';
        heart.textContent = '❤️';
        heart.style.left = Math.random() * 100 + '%';
        heart.style.animationDelay = Math.random() * 5 + 's';
        heart.style.fontSize = (Math.random() * 2 + 1.5) + 'rem';
        container.appendChild(heart);
      }
    }

    // Show love animation modal
    function showLoveAnimation() {
      document.getElementById('message').style.display = 'block';
      document.getElementById('loveModal').classList.add('active');
      createHeartBurst();
      createIntenseHeartAnimation();
    }

    // Close love modal
    function closeLoveModal() {
      document.getElementById('loveModal').classList.remove('active');
    }

    // Create heart burst animation
    function createHeartBurst() {
      const heartsBurst = document.getElementById('heartsBurst');
      heartsBurst.innerHTML = '';
      
      for (let i = 0; i < 15; i++) {
        const heart = document.createElement('div');
        heart.textContent = '❤️';
        heart.className = 'heart';
        heart.style.left = (Math.random() * 100 - 50) + '%';
        heart.style.animationDelay = (i * 0.1) + 's';
        heart.style.fontSize = (Math.random() * 2 + 1.5) + 'rem';
        heartsBurst.appendChild(heart);
      }
    }

    // Create intense heart animation when modal opens
    function createIntenseHeartAnimation() {
      const container = document.getElementById('floatingHeartsContainer');
      
      for (let i = 0; i < 30; i++) {
        const heart = document.createElement('div');
        heart.className = 'falling-heart';
        heart.textContent = '❤️';
        heart.style.left = Math.random() * 100 + '%';
        heart.style.animationDelay = Math.random() * 2 + 's';
        heart.style.fontSize = (Math.random() * 3 + 2) + 'rem';
        container.appendChild(heart);
        
        // Remove after animation
        setTimeout(() => heart.remove(), 10000);
      }
    }

    // No button runs away
    const noBtn = document.getElementById('noBtn');

    noBtn.addEventListener('mouseover', () => {
      const x = Math.floor(Math.random() * 300) - 150;
      const y = Math.floor(Math.random() * 300) - 150;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    // Initialize falling hearts on page load
    window.addEventListener('load', () => {
      createFallingHearts();
    });

    // Close modal when clicking outside
    document.getElementById('loveModal').addEventListener('click', (e) => {
      if (e.target.id === 'loveModal') {
        closeLoveModal();
      }
    });

  </script>
</body>
</html>
